apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: auth-secret
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# fetched once: a new AUTH_SECRET would sign every user out
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forge-frontend
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: keycloak
  target:
    name: forge-frontend
    template:
      data:
        AUTH_SECRET: "{{ .password }}"
        AUTH_KEYCLOAK_SECRET: "{{ .client }}"
  data:
    - secretKey: client
      remoteRef:
        key: forge-web-client
        property: password
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: auth-secret

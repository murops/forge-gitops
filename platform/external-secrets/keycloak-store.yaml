# lets the Forge environments copy the generated forge-web client secret from the keycloak namespace.
# On EKS the same ExternalSecrets would point to an AWS Secrets Manager store instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["forge-web-client"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: keycloak
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: keycloak
spec:
  conditions:
    - namespaceRegexes: ["^forge(-.*)?$"]
  provider:
    kubernetes:
      remoteNamespace: keycloak
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: keycloak
      auth:
        serviceAccount:
          name: secret-reader
          namespace: keycloak

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db-rw
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  http:
    httpEnabled: true
  # same issuer for browsers and pods, see the CoreDNS rewrite in scripts/up.sh
  hostname:
    hostname: http://keycloak.localhost
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  annotations:
    # keycloak-service is created by the operator, an unresolved backend would mark the route degraded
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
  hostnames:
    - keycloak.localhost
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080

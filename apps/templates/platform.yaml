apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "apps.metadata" (list "argocd" -3) }}
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: {{ .Values.versions.argocd }}
      helm:
        releaseName: argocd
        valueFiles:
          - $repo/bootstrap/argocd-values.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  {{- include "apps.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "apps.metadata" (list "envoy-gateway" -3) }}
spec:
  project: default
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: {{ .Values.versions.envoyGateway }}
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  {{- include "apps.syncPolicy" . | nindent 2 }}
